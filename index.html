
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCatalog | Catálogo Digital</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0F172A',
                        accent: '#3B82F6',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-slate-50 text-slate-900 antialiased; }
        }
        .product-card { @apply transition-all duration-300 hover:-translate-y-2; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-primary hidden sm:block uppercase">TECH<span class="text-accent">CATALOG</span></span>
                </div>

                <!-- Buscador -->
                <div class="flex-1 max-w-md mx-4 sm:mx-8">
                    <div class="relative group">
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Buscar productos..." 
                            class="w-full bg-slate-100 border-2 border-transparent rounded-2xl py-2.5 pl-10 pr-4 text-sm focus:bg-white focus:border-accent focus:ring-0 transition-all duration-300"
                        >
                        <div class="absolute left-3 top-2.5 text-slate-400 group-focus-within:text-accent transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Icons -->
                <div class="flex items-center gap-2 sm:gap-4">
                    <button class="p-2 text-slate-500 hover:text-accent transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Categorías -->
        <div class="mb-10 overflow-x-auto no-scrollbar">
            <div class="flex space-x-3 pb-2" id="categories-container">
                <!-- Se genera dinámicamente -->
            </div>
        </div>

        <!-- Encabezado Sección -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
            <div>
                <h2 class="text-3xl font-extrabold text-primary mb-2 tracking-tight uppercase">Catálogo Premium</h2>
                <p class="text-slate-500 font-medium">Explora las especificaciones detalladas de nuestra colección.</p>
            </div>
            <div class="bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm inline-flex items-center">
                <span id="product-count" class="text-sm font-bold text-accent mr-1">0</span>
                <span class="text-sm font-semibold text-slate-400 uppercase tracking-tighter">disponibles</span>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <div class="col-span-full py-20 text-center">
                <div class="inline-block w-8 h-8 border-4 border-accent border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- Estado Vacío -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-6 text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-primary mb-2">No hay resultados</h3>
            <p class="text-slate-500 max-w-xs mx-auto mb-8">No encontramos lo que buscas. Intenta con otros términos.</p>
            <button id="reset-filters" class="px-8 py-3 bg-primary text-white font-bold rounded-2xl hover:bg-accent transition-all shadow-lg uppercase text-xs tracking-widest">Ver Todo</button>
        </div>
    </main>

    <!-- Modal para Detalles -->
    <div id="product-modal" class="fixed inset-0 z-[60] hidden overflow-y-auto px-4 py-6 sm:px-0 flex items-center justify-center">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md transition-opacity duration-300 opacity-0"></div>
        
        <!-- Contenido Modal -->
        <div id="modal-content" class="relative bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden transition-all duration-300 scale-95 opacity-0">
            <button id="close-modal" class="absolute top-6 right-6 z-10 p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <div id="modal-body">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center">
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">© 2024 TechCatalog Premium. Experiencia de visualización de productos.</p>
        </div>
    </footer>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
